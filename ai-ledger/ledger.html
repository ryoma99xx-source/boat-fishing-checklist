<title>釣りサイト制作台帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700&family=Dela+Gothic+One&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow column (phone first), sticky header, fixed bottom tab bar; detail opens as its own view. */
:root{
  --bg:#eef2f3; --surface:#ffffff; --ink:#14262d; --muted:#5b6f76; --line:#d5dee1;
  --accent:#0b6e78; --accent-ink:#ffffff; --accent-soft:#d8eeef;
  --s-idea:#6b7a80; --s-work:#1f63c6; --s-wait:#b26a00; --s-done:#227a3d; --s-hold:#7a4f9a;
  --warn-bg:#fff4dc; --warn-ink:#7a4a00; --bad:#b3261e;
  --f-display:"Dela Gothic One","Zen Kaku Gothic New",system-ui,sans-serif;
  --f-body:"Zen Kaku Gothic New","Hiragino Sans","Noto Sans JP",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --ai-claude:#b8501f; --ai-gpt:#0f7a5a; --ai-codex:#3a4fb8; --ai-me:#66767c;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0d171b; --surface:#152329; --ink:#e3ecee; --muted:#93a8ae; --line:#26383f;
  --accent:#4fc0c9; --accent-ink:#06262a; --accent-soft:#173a3f;
  --s-idea:#9aa8ad; --s-work:#6fa6ff; --s-wait:#f0a63a; --s-done:#5cc77a; --s-hold:#c79ae6;
  --warn-bg:#3a2d10; --warn-ink:#f5d38a; --bad:#ff8a80; --ai-claude:#ff9d6e; --ai-gpt:#4fd1a5; --ai-codex:#9fb0ff; --ai-me:#a9b6ba; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d171b; --surface:#152329; --ink:#e3ecee; --muted:#93a8ae; --line:#26383f;
  --accent:#4fc0c9; --accent-ink:#06262a; --accent-soft:#173a3f;
  --s-idea:#9aa8ad; --s-work:#6fa6ff; --s-wait:#f0a63a; --s-done:#5cc77a; --s-hold:#c79ae6;
  --warn-bg:#3a2d10; --warn-ink:#f5d38a; --bad:#ff8a80; --ai-claude:#ff9d6e; --ai-gpt:#4fd1a5; --ai-codex:#9fb0ff; --ai-me:#a9b6ba; color-scheme:dark}
html{background:var(--bg)}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(76px + env(safe-area-inset-bottom,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
.wrap{max-width:720px;margin:0 auto}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:12px 8px;display:flex;align-items:baseline;justify-content:space-between;gap:8px;border-bottom:1px solid var(--line)}
h1{font-family:var(--f-display);font-weight:400;font-size:20px;margin:0;letter-spacing:.02em;text-wrap:balance}
h1 small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500;margin-left:6px}
h2{font-size:17px;margin:18px 0 8px;text-wrap:balance}
h3{font-size:15px;margin:14px 0 6px}
.sync{font-size:12px;color:var(--muted);white-space:nowrap}
.sync b{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin-right:4px;vertical-align:1px}
.sync.ok b{background:var(--s-done)}
.banner{background:var(--warn-bg);color:var(--warn-ink);padding:10px 12px;border-radius:8px;margin:12px 0;font-size:14px}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 10px;text-align:left;font:inherit;color:inherit;cursor:pointer}
.stat .n{font-family:var(--f-display);font-size:22px;line-height:1.1;font-variant-numeric:tabular-nums}
.stat .l{font-size:12px;color:var(--muted)}
.stat[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.filters{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}
.filters input,.filters select{flex:1 1 150px;min-width:0}
input,select,textarea{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:9px 10px;width:100%;box-sizing:border-box}
textarea{min-height:90px;resize:vertical}
input:focus,select:focus,textarea:focus,button:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
label{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px;letter-spacing:.04em}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row2>div{min-width:0}
button,.btn{font:inherit;font-size:14px;border-radius:8px;padding:9px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;text-decoration:none;display:inline-block}
button.primary,.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:700}
button.danger{color:var(--bad);border-color:var(--bad);background:transparent}
button.small{padding:5px 10px;font-size:13px}
button:disabled{opacity:.5;cursor:default}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin:12px 0}
.list{display:flex;flex-direction:column;gap:8px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:block;color:inherit;text-decoration:none;min-width:0}
.card .meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.card .title{font-weight:700;margin:4px 0 2px;overflow-wrap:anywhere}
.card .next{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.card .next b{color:var(--ink);font-weight:500}
.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:1px 8px;font-size:12px;font-weight:700;border:1px solid currentColor;white-space:nowrap}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.st-構想{color:var(--s-idea)} .st-作業中{color:var(--s-work)} .st-確認・公開待ち{color:var(--s-wait)} .st-公開済み{color:var(--s-done)} .st-保留{color:var(--s-hold)}
.tag{border-radius:4px;padding:0 6px;background:var(--accent-soft);color:var(--ink);font-size:12px;white-space:nowrap}
.who{font-weight:700;color:var(--ink)}
.stale{color:var(--warn-ink);background:var(--warn-bg);border-radius:4px;padding:0 6px}
.empty{color:var(--muted);text-align:center;padding:28px 8px;border:1px dashed var(--line);border-radius:10px}
.mono{font-family:var(--f-mono);font-size:12.5px;overflow-wrap:anywhere}
.box{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin:10px 0}
.chat{display:flex;gap:8px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line)}
.chat:first-child{border-top:0}
.chat .c{flex:1;min-width:0}
.chat a{color:var(--accent);overflow-wrap:anywhere;font-size:13px}
.log{padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.log:first-child{border-top:0}
.log .when{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.log .txt{white-space:pre-wrap;overflow-wrap:anywhere}
details summary{cursor:pointer;color:var(--accent);font-size:13px}
pre.out{white-space:pre-wrap;overflow-wrap:anywhere;font-family:var(--f-body);font-size:13.5px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;margin:8px 0;max-height:60vh;overflow:auto}
.checks label{display:flex;gap:8px;align-items:flex-start;font-size:14px;color:var(--ink);letter-spacing:0;margin:6px 0}
.checks input{width:auto;margin-top:4px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:700}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:20;max-width:90vw}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:8;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;padding:8px 2px 6px;font-size:11px;color:var(--muted);text-decoration:none}
nav.tabs a svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs a[aria-current="page"]{color:var(--accent);font-weight:700}
.flow{display:flex;flex-direction:column;gap:6px;margin:8px 0}
.flow .step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.flow .arrow{text-align:center;color:var(--muted);font-size:13px}
.flow .step b{display:block}
.legend{display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14px}
.badge-n{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--bad);color:#fff;font-size:10px;line-height:16px;text-align:center}
.ai-Claude{--c:var(--ai-claude)} .ai-ChatGPT{--c:var(--ai-gpt)} .ai-Codex{--c:var(--ai-codex)} .ai-自分{--c:var(--ai-me)}
.legend-ai{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.legend-ai button{display:inline-flex;align-items:center;gap:6px;border-color:var(--c,var(--line))}
.legend-ai button .dot{width:10px;height:10px;border-radius:50%;background:var(--c,var(--muted))}
.legend-ai button[aria-pressed="true"]{box-shadow:inset 0 0 0 1.5px var(--c,var(--accent));font-weight:700}
.places{font-size:13px;color:var(--muted);margin:2px 0 10px}
.places b{color:var(--c)}
.sitemap{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;margin:10px 0}
.sitemap header{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.sitemap header h3{margin:0;font-size:16px}
.sitemap header a{font-size:12px;color:var(--accent);overflow-wrap:anywhere}
.flowrow{display:flex;flex-wrap:wrap;align-items:stretch;gap:6px}
.role{display:flex;flex-direction:column;gap:1px;flex:1 1 128px;min-width:0;text-align:left;font:inherit;color:inherit;cursor:pointer;background:var(--bg);border:1.5px solid var(--c);border-radius:8px;padding:6px 8px;transition:opacity .2s}
.role .stp{font-size:11px;color:var(--muted);letter-spacing:.04em}
.role .ai{font-weight:700;color:var(--c);font-size:14px}
.role .pl{font-size:12.5px}
.role .dt{font-size:12px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.role.dim{opacity:.22}
.role.add{border-style:dashed;border-color:var(--line);color:var(--muted);align-items:center;justify-content:center;flex:0 0 auto}
.arr{align-self:center;color:var(--muted);font-size:14px}
.sitefoot{display:flex;gap:10px;flex-wrap:wrap;margin-top:8px;font-size:12px;color:var(--muted)}
.sitefoot a{color:var(--accent)}
@media (max-width:420px){.row2{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <h1>制作台帳<small>cutlassfish.tokyo</small></h1>
    <span class="sync" id="sync"><b></b>接続中…</span>
  </header>
  <div id="conn" class="banner" hidden></div>
  <main id="view"></main>
</div>

<nav class="tabs" aria-label="画面">
  <a href="#list" data-v="list"><svg viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h10"/></svg>一覧</a>
  <a href="#map" data-v="map"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="6" rx="1"/><rect x="14" y="4" width="7" height="6" rx="1"/><rect x="8.5" y="15" width="7" height="6" rx="1"/><path d="M6.5 10v2.5h11V10M12 12.5V15"/></svg>全体図</a>
  <a href="#inbox" data-v="inbox"><svg viewBox="0 0 24 24"><path d="M4 13l3-8h10l3 8v6H4z"/><path d="M4 13h5l1 2h4l1-2h5"/></svg><span>未整理 <span id="inboxN"></span></span></a>
  <a href="#handoff" data-v="handoff"><svg viewBox="0 0 24 24"><path d="M4 12h13M13 7l5 5-5 5"/></svg>指示文</a>
  <a href="#report" data-v="report"><svg viewBox="0 0 24 24"><path d="M20 12H7M11 7l-5 5 5 5"/></svg>報告</a>
  <a href="#howto" data-v="howto"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9.5a2.5 2.5 0 1 1 3.5 2.3c-.7.3-1 .9-1 1.7M12 17h.01"/></svg>仕組み</a>
</nav>

<script>
const SITES=[
  {k:'main',n:'本サイト',u:'https://cutlassfish.tokyo/'},
  {k:'tide',n:'潮と流れマップ',u:'https://tide-current-map.cutlassfish.tokyo/'},
  {k:'reel',n:'リール糸管理',u:'https://reel-line-manager.cutlassfish.tokyo/'},
  {k:'check',n:'釣り持ち物チェック',u:'https://dont-forget-anything.cutlassfish.tokyo/'},
  {k:'tenya',n:'テンヤシミュレーター',u:'https://tenya-simulator.cutlassfish.tokyo/'},
  {k:'other',n:'その他・共通',u:''}];
const STATUS=['構想','作業中','確認・公開待ち','公開済み','保留'];
const OWNERS=['Claude','ChatGPT','Codex','自分'];
const AIS=['Claude','ChatGPT','Codex'];
const TOOLS=['Claude Code','Claude チャット','ChatGPT','Codex','その他'];
const TARGETS=['ChatGPT','Claude チャット','Claude Code','Codex'];
const STALE_DAYS=14;
const BASE_RULES=[
  '既存の公開設定・ドメイン・プロジェクトIDを変えない',
  '新しいプロジェクト（Sites・リポジトリ・アプリ等）を作らない',
  'APIキー・パスワード・個人情報を出力やファイルに含めない',
  '公開・上書きの前に、何を変えるかを一度報告して確認を取る',
  '分からない点は推測で進めず、質問として報告に書く'];
const UPLOAD_LIMIT={'Claude チャット':30,'ChatGPT':512}; // MB per file, rough guide

let db=null, sample=null, loaded=false, feats=[], inbox=[], route={v:'list',id:null};
let ui={filter:'all',site:'',q:'',ho:{fid:'',target:'ChatGPT',req:'',rules:null,extra:'',split:false,text:''},rep:{text:'',fid:''},inboxText:''};
try{const s=JSON.parse(localStorage.getItem('ledger-ui')||'null'); if(s){ui.filter=s.filter||'all';ui.site=s.site||'';}}catch(e){}
const saveUi=()=>{try{localStorage.setItem('ledger-ui',JSON.stringify({filter:ui.filter,site:ui.site}))}catch(e){}};

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let extraSites=[],roles=[];
const allSites=()=>[...SITES.filter(s=>s.k!=='other'),...extraSites.slice().sort((a,b)=>String(a.at).localeCompare(String(b.at))),SITES.find(s=>s.k==='other')];
const siteName=k=>(allSites().find(s=>s.k===k)||{n:k||'未設定'}).n;
const siteUrl=k=>(allSites().find(s=>s.k===k)||{}).u||'';
const STEPS=['テーマ・デザイン','ツール制作','公開・デプロイ','記事作成','WordPress登録','運用・データ','その他'];
const PLACES=['Claude Code','Claude チャット','Claude プロジェクト','ChatGPT チャット','ChatGPT Sites','ChatGPT GPTs・プラグイン','ChatGPT プロジェクト','Codex','WordPress管理画面','GitHub','場所未確認'];
const targetFor=r=>r.ai==='ChatGPT'?'ChatGPT':r.ai==='Codex'?'Codex':r.ai==='Claude'?(/Code/.test(r.place||'')?'Claude Code':'Claude チャット'):'ChatGPT';
const pad=n=>String(n).padStart(2,'0');
const fmt=iso=>{if(!iso)return'';const d=new Date(iso);return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`};
const nowIso=()=>new Date().toISOString();
const newId=()=>'f-'+Math.random().toString(36).slice(2,6)+Date.now().toString(36).slice(-2);
const daysSince=iso=>iso?Math.floor((Date.now()-new Date(iso))/864e5):999;
const lastTouch=f=>{const l=(f.logs||[]).map(x=>x.at).sort().pop();return l||f.updatedAt||f.createdAt};
const isAI=f=>AIS.includes(f.owner)&&(f.status==='作業中'||f.status==='確認・公開待ち');
const isStopped=f=>f.status==='保留'||(f.status!=='公開済み'&&daysSince(lastTouch(f))>=STALE_DAYS);
const toolFromUrl=u=>{u=u||'';if(/claude\.ai\/code/.test(u))return'Claude Code';if(/claude\.ai/.test(u))return'Claude チャット';if(/chatgpt\.com\/codex|codex/.test(u))return'Codex';if(/chatgpt\.com|chat\.openai\.com/.test(u))return'ChatGPT';return'その他'};
const ownerFromTool=t=>t.startsWith('Claude')?'Claude':t==='ChatGPT'?'ChatGPT':t==='Codex'?'Codex':'自分';
function toast(m){const t=document.createElement('div');t.className='toast';t.textContent=m;document.body.appendChild(t);setTimeout(()=>t.remove(),2200)}
function setConn(msg){const c=$('#conn');c.hidden=!msg;c.textContent=msg||''}

// one write at a time per document
const chains={};
function write(col,id,fn){chains[col+id]=(chains[col+id]||Promise.resolve()).then(()=>fn(db.collection(col).doc(id))).catch(e=>{toast('保存できませんでした：'+(e&&e.message||e.code||e));throw e});return chains[col+id]}
const saveFeat=(id,patch)=>write('features',id,ref=>ref.update({...patch,updatedAt:nowIso()}));
const createFeat=(id,data)=>write('features',id,ref=>ref.set({chats:[],logs:[],src:{},deploy:'',next:'',createdAt:nowIso(),updatedAt:nowIso(),...data}));
const delFeat=id=>write('features',id,ref=>ref.delete());
function addLog(f,text,by){const logs=[...(f.logs||[]),{at:nowIso(),by:by||'自分',text}];return saveFeat(f.id,{logs})}

// ---------- routing ----------
function readHash(){const h=location.hash.slice(1);if(/^f-[a-z0-9-]+$/.test(h))route={v:'detail',id:h};else route={v:['list','map','inbox','handoff','report','howto'].includes(h)?h:'list',id:null};render()}
window.addEventListener('hashchange',readHash);
function go(h){if(location.hash==='#'+h)readHash();else location.hash=h}

// ---------- views ----------
let dirty={},lastKey='';
document.addEventListener('input',e=>{if(e.target.id&&e.target.closest('#view'))dirty[e.target.id]=1});
document.addEventListener('change',e=>{if(e.target.id&&e.target.closest('#view'))dirty[e.target.id]=1});
const clean=prefix=>Object.keys(dirty).forEach(k=>{if(k.startsWith(prefix))delete dirty[k]});
function render(){
  const key=route.v+(route.id||'');const keep={};
  if(key===lastKey)Object.keys(dirty).forEach(k=>{const el=document.getElementById(k);if(el)keep[k]=el.type==='checkbox'?el.checked:el.value});else dirty={};
  lastKey=key;
  renderInner();
  Object.entries(keep).forEach(([k,v])=>{const el=document.getElementById(k);if(el){if(el.type==='checkbox')el.checked=v;else el.value=v}});
}
function renderInner(){
  document.querySelectorAll('nav.tabs a').forEach(a=>a.setAttribute('aria-current',a.dataset.v===(route.v==='detail'?'list':route.v)?'page':'false'));
  $('#inboxN').innerHTML=inbox.length?`<span class="badge-n">${inbox.length}</span>`:'';
  const v=$('#view');
  if(route.v==='detail')v.innerHTML=viewDetail();
  else if(route.v==='map')v.innerHTML=viewMap();
  else if(route.v==='inbox')v.innerHTML=viewInbox();
  else if(route.v==='handoff')v.innerHTML=viewHandoff();
  else if(route.v==='report')v.innerHTML=viewReport();
  else if(route.v==='howto')v.innerHTML=viewHowto();
  else v.innerHTML=viewList();
  bind();
}
function notReady(){return !loaded?`<div class="empty">台帳を読み込んでいます…<br>表示されない場合は claude.ai にログインした状態で開き直してください。</div>`:''}

function cardHtml(f){
  const d=daysSince(lastTouch(f));
  return `<a class="card" href="#${esc(f.id)}">
    <div class="meta"><span class="tag">${esc(siteName(f.site))}</span><span class="pill st-${esc(f.status)}">${esc(f.status)}</span><span>担当 <span class="who">${esc(f.owner)}</span></span>
    ${(f.chats||[]).length?`<span>チャット${f.chats.length}</span>`:''}
    ${f.status!=='公開済み'&&d>=STALE_DAYS&&d<999?`<span class="stale">${d}日動きなし</span>`:''}</div>
    <div class="title">${esc(f.title)}</div>
    ${f.next?`<div class="next">次：<b>${esc(f.next)}</b></div>`:''}

function treeUrl(s){return `https://github.com/${s.repo}/tree/${s.branch}${s.folder?'/'+s.folder:''}`}
function archiveUrl(s){return `https://github.com/${s.repo}/archive/refs/heads/${s.branch}.zip`}
function rulesFor(f){
  const r=[...BASE_RULES];

  return r}

  if(sr.length){L.push('','## このサイトの分担（どの作業をどのAIのどこでやっているか）');sr.forEach(r=>L.push(`- ${r.step}：${r.ai}（${r.place||'場所未確認'}）${r.detail?' … '+r.detail.replace(/\n+/g,' '):''}`));L.push('- 自分の担当外の工程（例：公開）は勝手に行わず、必要なら報告に書いてください。')}
  L.push('','## これまでの経過');
  (f.chats||[]).forEach(c=>L.push(`- ${c.tool}「${c.name||'名前なし'}」${c.url||''}`));
  if(f.next)L.push(`- 台帳上の次の一手：${f.next}`);
  if(logs.length){L.push('- 最近の作業ログ（新しい順）');logs.forEach(l=>L.push(`  - ${fmt(l.at).slice(0,10)} ${l.by}：${String(l.text).split('\n')[0].slice(0,140)}`))}
  L.push('','## ソースの受け取り方');
  const hasGit=s.repo&&s.branch;
  if(net){
    let n=1;
    if(s.zipUrl){L.push(`${n++}. 次のURLからZIPをダウンロードして使ってください：${s.zipUrl}`)}
    else if(hasGit){L.push(`${n++}. GitHub のフォルダ ${treeUrl(s)} を使ってください。ブランチ全体のZIPは ${archiveUrl(s)} です（リポジトリが非公開で開けない場合は次へ）。`)}
    if(s.zip){L.push(`${n++}. ネットに出られない、またはURLが開けない場合は、このメッセージに添付したZIP「${s.zip}」を使ってください。`)}
    if(h.split&&s.zip){L.push(`${n++}. 添付が「${s.zip.replace(/\.zip$/,'')}.part-aa」「…part-ab」のように分割されている場合は、名前順に連結して「${s.zip}」に戻してから使ってください（例：cat ${s.zip.replace(/\.zip$/,'')}.part-* > ${s.zip}）。`)}
    if(s.sha&&s.zip){L.push(`${n++}. 使う前に「${s.zip}」のSHA256が ${s.sha} と一致するか確認してください。一致しない場合は作業を止めて報告してください。`)}
    if(n===1)L.push('（ソースの場所は未登録です。必要なファイルは別途添付します。）');
    if(hasGit&&s.folder)L.push(`- 主に触るフォルダ：${s.folder}`);
  }else{
    if(hasGit){
      L.push(`- GitHub リポジトリ ${s.repo} のブランチ ${s.branch}${s.folder?`、フォルダ ${s.folder}`:''} から作業してください。`);
      L.push(`- 参照URL：${treeUrl(s)}`);
      L.push('- このセッションにリポジトリが無い場合は、リポジトリを追加してから取得してください。新しいリポジトリは作らないでください。');
      L.push('- 作業したブランチ名とコミットを報告に書いてください。');
    }else L.push('（リポジトリは未登録です。必要なファイルは別途添付します。）');
    if(s.zip&&s.sha)L.push(`- 公開用ZIPを作り直した場合は、ZIP名とSHA256を報告に書いてください（現在：${s.zip} / ${s.sha}）。`);
  }
  L.push('','## 守ってほしい条件');
  (h.rules||rulesFor(f)).forEach(r=>L.push(`- ${r}`));
  h.extra.split('\n').map(x=>x.trim()).filter(Boolean).forEach(r=>L.push(`- ${r}`));
  L.push('','## 完了したら、この書式で報告してください','（このまま台帳に貼り付けます。項目名は変えないでください。該当なしは「なし」）','',
    '【完了報告】',`機能ID：${f.id}`,`担当：${t.startsWith('Claude')?'Claude':t}`,'状態：（構想／作業中／確認・公開待ち／公開済み／保留 から1つ）','やったこと：','変更したもの（ブランチ・コミット・ファイル）：','ZIP名：','SHA256：','公開URL・バージョン：','次の一手：','確認したいこと：');
  return L.join('\n')}

function parseReport(t){
  const keys=['機能ID','担当','状態','やったこと','変更したもの','ZIP名','SHA256','公開URL','次の一手','確認したいこと'];
  const out={};let cur=null;
  t.split('\n').forEach(line=>{
    const k=keys.find(k=>new RegExp('^\\s*[-・]?\\s*\\**'+k).test(line));
    if(k){cur=k;out[k]=line.replace(/^[^：:]*[：:]\s*/,'').trim()}
    else if(cur&&line.trim()&&!/^【/.test(line))out[cur]+=(out[cur]?'\n':'')+line.trim();
  });
  Object.keys(out).forEach(k=>{if(/^(なし|ー|-|（.*）)$/.test(out[k]))out[k]=''});
  return out}

  on('#newFeat','click',async()=>{const id=newId();await createFeat(id,{title:'新しい機能',site:ui.site||'main',status:'構想',owner:'自分'});go(id)});

    on('#dRep','click',()=>{ui.rep={text:'',fid:f.id};go('report')});

    on('#lAdd','click',async()=>{const t=$('#lText').value.trim();if(!t)return;await addLog(f,t,$('#lBy').value);clean('l');toast('記録しました')});
    on('#dDel','click',()=>{$('#delZone').innerHTML=`<span>本当に削除しますか？ログも消えます。</span><button class="danger" id="dDel2">削除する</button><button id="dCancel">やめる</button>`;
      on('#dDel2','click',async()=>{await delFeat(f.id);toast('削除しました');go('list')});on('#dCancel','click',render)});

    for(const line of lines){const m=line.match(/https?:\/\/\S+/);const url=m?m[0]:'';const title=line.replace(url,'').replace(/^[\s\-–・|｜:：]+|[\s\-–・|｜:：]+$/g,'').trim();
      const id='i-'+Math.random().toString(36).slice(2,9);await write('inbox',id,r=>r.set({title,url,tool:toolFromUrl(url),at:nowIso()}));n++}
    ui.inboxText='';clean('iText');toast(n+'件取り込みました')});

    const it=inbox.find(x=>x.id===card.dataset.inbox);

    card.querySelector('.iGo').onclick=async()=>{const dest=card.querySelector('.iDest').value;if(!dest)return toast('振り分け先を選んでください');
      const chat={tool:it.tool,name:it.title,url:it.url};

  // handoff
  const regen=()=>{ui.ho.text=buildPrompt();const o=$('#hOut');if(o)o.textContent=ui.ho.text;$('#hTidyMsg')&&($('#hTidyMsg').innerHTML='')};
  on('#hFeat','change',e=>{ui.ho.fid=e.target.value;ui.ho.rules=null;ui.ho.text='';render()});

  on('#hTidy','click',tidy);
  // report
  on('#rText','input',e=>{ui.rep.text=e.target.value;const p=e.target.selectionStart;render();const t=$('#rText');t.focus();t.setSelectionRange(p,p)});
  on('#rFeat','change',e=>{ui.rep.fid=e.target.value;render()});
  on('#rSave','click',async()=>{
    const r=ui.rep,tf=feats.find(x=>x.id===r.fid);if(!tf)return;const p=parseReport(r.text);
    const by=AIS.find(a=>(p['担当']||'').includes(a))||'自分';

    if($('#rSt')?.checked)patch.status=STATUS.find(s=>p['状態'].includes(s));
    if($('#rNext')?.checked)patch.next=p['次の一手'].split('\n')[0];

    await saveFeat(tf.id,patch);ui.rep={text:'',fid:''};toast('台帳に記録しました');go(tf.id)});
}

// facts that must survive AI tidying
function facts(t){return [...new Set([...(t.match(/https?:\/\/[^\s）)」]+/g)||[]),...(t.match(/\b[0-9a-f]{64}\b/gi)||[]),...(t.match(/appg(?:prj|ver)_[0-9a-f]+/g)||[]),...(t.match(/f-[a-z0-9]{4,}/g)||[]),...(t.match(/[\w.-]+\.zip/g)||[])])]}
async function tidy(){
  const msg=$('#hTidyMsg'),orig=ui.ho.text;if(!orig)return;
  if(!sample){msg.innerHTML='<div class="banner">この表示ではAI整形を使えません（claude.ai で開いてください）。</div>';return}
  msg.innerHTML='<div class="banner">整えています…</div>';$('#hTidy').disabled=true;
  try{
    const res=await sample(`次の「AIへの依頼文」を、受け取るAIが迷わず実行できるよう読みやすく整えてください。\n厳守：URL・SHA256・ID・ZIP名・ブランチ名・フォルダ名・数値は1文字も変えない。「守ってほしい条件」の項目は削らず意味も変えない。【完了報告】以下の書式はそのまま残す。新しい事実や条件を足さない。見出し構成は保つ。整えた依頼文だけを出力。\n\n----\n${orig}`,{modelTier:'default',cache:false});
    const out=(res.text||'').trim();const lost=facts(orig).filter(x=>!out.includes(x));
    const rulesLost=[...(ui.ho.rules||[])].filter(r=>!out.includes(r.slice(0,8)));
    if(!out||lost.length||!out.includes('【完了報告】')){msg.innerHTML=`<div class="banner">整形結果で事実が変わったため採用しませんでした：${esc(lost.slice(0,3).join(' / ')||'報告書式が欠落')}</div>`}
    else{ui.ho.text=out;$('#hOut').textContent=out;msg.innerHTML=`<div class="banner">整えました。URL・SHA256・IDはすべて一致を確認済み。${rulesLost.length?'条件の言い回しが変わった項目があります。目で確認してください。':''}</div>`}
  }catch(e){msg.innerHTML=`<div class="banner">AI整形できませんでした（${esc(e.code||e.message||'')}）。元の指示文はそのまま使えます。</div>`}
  finally{const b=$('#hTidy');if(b)b.disabled=false}}

  db.collection('features').onSnapshot(s=>{feats=s.docs.map(d=>({id:d.id,...d.data()}));loaded=true;clearTimeout(timer);setConn('');

})();
