<style>/* Layout: one-column deck tool in the TOKYO BAY FISHING tool style: night-navy ground, teal for the catch action, amber for notes, a tide chart up top and a running log below; the buttons stay docked at the bottom. */
:root{
  --bg:#060a11; --surface:#0b1422; --surface2:#101c2e; --ink:#eef3f8; --muted:#9cabbd; --line:#1f2d42;
  --teal:#41c9c6; --amber:#e3a43b; --pink:#e5577f; --sea:#0c2747;
  --catch:#41c9c6; --catch-ink:#03161c; --tide:#41c9c6; --bite:#e3a43b; --danger:#e5577f; --chipon:#41c9c6; --chipon-ink:#03161c;
  --f-body:"Noto Sans JP","Hiragino Sans","Hiragino Kaku Gothic ProN",system-ui,sans-serif;
  --f-num:"Barlow Condensed","Noto Sans JP","Hiragino Sans",system-ui,sans-serif;
  --r:14px; color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.55;-webkit-tap-highlight-color:transparent;
  /* the sticky header sits at top:inset; without this padding its natural place is y=0, so on phones with a notch / Dynamic Island it is pushed down over the page by the inset */
  padding-top:env(safe-area-inset-top,0px)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--tide);outline-offset:2px}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:560px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{font-weight:700;letter-spacing:.04em;font-size:15px}
.brand small{display:block;font-family:var(--f-num);font-weight:500;letter-spacing:.2em;color:var(--muted);font-size:11px;line-height:1}
.sync{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px;text-align:right}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.sync.ok i{background:var(--tide)} .sync.wait i{background:var(--catch)}
main{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px calc(96px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:16px}
h1{font-size:22px;margin:0;text-wrap:balance}
h2{font-size:16px;margin:0}
p{margin:0}
.muted{color:var(--muted);font-size:13px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:12px;min-height:48px;padding:10px 16px;font-weight:700}
.btn.primary{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn.big{min-height:60px;font-size:18px}
.btn.sm{min-height:36px;padding:6px 12px;font-size:13px;font-weight:500}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:currentColor;background:transparent}
.btn.end{background:transparent;border:2px solid var(--line);color:var(--muted);min-height:56px}
.btn.end.armed{border-color:var(--danger);color:var(--danger)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>span{font-size:13px;color:var(--muted);font-weight:500}
input[type=text],input[type=date],input[type=time],input[type=number],select,textarea{width:100%;min-height:46px;border:1px solid var(--line);background:var(--surface2);border-radius:10px;padding:8px 12px;font-size:16px}
textarea{min-height:140px;font-family:ui-monospace,Menlo,monospace;font-size:14px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.stepper{display:flex;align-items:center;gap:8px}
.stepper b{font-family:var(--f-num);font-size:28px;min-width:2ch;text-align:center;font-variant-numeric:tabular-nums}
.stepper .btn{min-width:48px;padding:0}
.seatwrap{display:flex;gap:16px;align-items:center}
.seatwrap svg{width:150px;flex:none}
.seat-hit{cursor:pointer}
.seat-note{min-width:0}
.seat-note b{font-size:20px;display:block}
.tide-row{display:grid;grid-template-columns:88px 1fr 84px 40px;gap:8px;align-items:center}
.tide-row .x{min-height:46px;border:none;background:transparent;color:var(--muted);font-size:20px}
/* record */
.tripbar{display:flex;justify-content:space-between;align-items:center;gap:12px}
.tb-boat{font-weight:700;font-size:18px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.tb-seat{font-size:14px;font-weight:700;color:var(--catch)}
.tb-sub{font-size:13px;color:var(--muted)}
.counter{display:flex;align-items:baseline;justify-content:center;gap:6px;margin-top:4px}
.count-num{font-family:var(--f-num);font-weight:600;font-size:112px;line-height:.9;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.count-num.bump{animation:bump .35s ease-out}
@keyframes bump{0%{transform:scale(1.18);color:var(--catch)}100%{transform:scale(1)}}
.count-unit{font-size:22px;font-weight:700;color:var(--muted)}
.since{text-align:center;font-size:13px;color:var(--muted);margin-top:-8px}
.catch-btn{width:100%;min-height:clamp(150px,30vh,240px);border:none;border-radius:24px;background:var(--catch);color:var(--catch-ink);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;box-shadow:0 6px 0 rgba(0,0,0,.18);transition:transform .06s}
.catch-btn span:first-child{font-size:32px;font-weight:700;letter-spacing:.08em}
.catch-btn .plus{font-family:var(--f-num);font-size:30px;font-weight:600;opacity:.85}
.catch-btn:active{transform:translateY(4px);box-shadow:0 2px 0 rgba(0,0,0,.18)}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.row3 .btn{min-height:56px;display:flex;align-items:center;justify-content:center;gap:6px}
.row3 small{font-family:var(--f-num);font-size:18px;color:var(--muted)}
.gearpick{display:flex;flex-direction:column;gap:6px}
.gp-lbl{font-size:13px;color:var(--muted);font-weight:500}
.bz-row{display:flex;align-items:center;gap:10px}.bz-l{flex:none;width:44px;font-size:13px;color:var(--muted);font-weight:700}.bz .chips .chip{min-height:40px;padding:6px 14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:44px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);background:var(--surface);font-size:15px;white-space:nowrap}
.chip.on{background:var(--chipon);color:var(--chipon-ink);border-color:var(--chipon);font-weight:700}
.chip.add{color:var(--muted);min-width:44px}
.cond{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.cond svg{width:34px;height:48px;flex:none;color:var(--ink)}
.cond .ct{flex:1;min-width:0;display:flex;flex-direction:column}
.cond .ct small{color:var(--muted);font-size:13px}
.cond .go,.btnlink .go{font-size:13px;color:var(--tide);font-weight:700;flex:none;white-space:nowrap}
.g-hull{fill:var(--surface);stroke:currentColor}
.g-arrow{stroke:var(--tide);fill:var(--tide)}
.btnlink{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:transparent;border:1px dashed var(--line);border-radius:var(--r);padding:12px 14px;color:var(--ink)}
.btnlink small{display:block;color:var(--muted);font-size:13px}
.loghead{display:flex;align-items:baseline;justify-content:space-between}
.log{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;border-top:1px solid var(--line)}
.log li{border-bottom:1px solid var(--line)}
.logrow{display:grid;grid-template-columns:52px minmax(92px,auto) 1fr;gap:8px;align-items:center;width:100%;text-align:left;background:none;border:none;padding:10px 2px;min-height:48px}
.lr-time{font-family:var(--f-num);font-size:20px;font-variant-numeric:tabular-nums}
.lr-kind{font-size:13px;font-weight:700;white-space:nowrap}
.k-catch{color:var(--catch)} .k-bite{color:var(--bite)} .k-lost{color:var(--danger)}
.lr-gear{font-size:13px;color:var(--muted);min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{padding:16px 2px;color:var(--muted);font-size:14px}
/* figures */
.figsel{display:flex;gap:8px;align-items:center;position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--topH,64px));z-index:4;background:var(--bg);padding:8px 0;margin-top:-8px}
.figsel select{flex:1;min-width:0}.figsel .figcal{flex:none;display:inline-flex;align-items:center;gap:4px;white-space:nowrap}
.sample-note .btn{display:block;margin-top:8px}
.badge{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--surface2);color:var(--muted);border:1px solid var(--line)}
.badge.live{color:var(--catch);border-color:currentColor}
.scrollx{overflow-x:auto;-webkit-overflow-scrolling:touch;border-radius:12px;border:1px solid var(--line)}
.scrollx svg{display:block;width:940px;height:auto}
.fitw{border-radius:12px;border:1px solid var(--line);overflow:hidden}
.fitw svg{display:block;width:100%;height:auto}
.swipe{font-size:13px;color:var(--tide);font-weight:500}
.figfoot{display:flex;gap:8px;flex-wrap:wrap}
/* history */
.trip{display:flex;flex-direction:column;gap:10px;padding:14px 0;border-bottom:1px solid var(--line)}
.trip:first-child{padding-top:0}
.trip:last-child{border-bottom:none;padding-bottom:0}
.trip-h{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
.trip-h b{font-size:16px}
.trip-n{font-family:var(--f-num);font-size:30px;font-weight:600;line-height:1;color:var(--catch);font-variant-numeric:tabular-nums}
.trip-n small{font-family:var(--f-body);font-size:13px;color:var(--muted);font-weight:500;margin-left:2px}
.trip-act{display:flex;gap:8px;flex-wrap:wrap}
.btn.two{display:inline-flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.2;gap:2px}.btn.two small{font-size:11px;font-weight:500;color:var(--muted)}
.dk-sub .dk-undo{font-size:12px}.dk-undo small{font-size:11px;font-weight:500;color:var(--muted);font-family:var(--f-num)}
.zones{display:grid;grid-template-columns:1fr 1fr;gap:6px;position:relative;padding-top:34px}
.zones::before{content:"ミヨシ";position:absolute;top:0;left:50%;transform:translateX(-50%);font-size:12px;font-weight:700;color:var(--tide);letter-spacing:.1em}
.zone{background:var(--surface2);border:1px solid var(--line);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.zone .zn{font-size:12px;color:var(--muted)}
.zone .za{font-family:var(--f-num);font-size:26px;font-weight:600;line-height:1.1;font-variant-numeric:tabular-nums}
.zone .za small{font-family:var(--f-body);font-size:12px;color:var(--muted);font-weight:500}
.zone.none .za{color:var(--muted);font-size:18px}
.zones-foot{text-align:center;font-size:12px;font-weight:700;color:var(--tide);letter-spacing:.1em}
/* gear */
.grow{display:flex;gap:8px;align-items:center}
.grow input{flex:1;min-width:0}
.grow.hid input{opacity:.5}
.grow .num{width:84px;flex:none}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:4px}
.tab{background:none;border:none;min-height:52px;border-radius:10px;font-size:14px;font-weight:700;color:var(--muted);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.tab svg{width:22px;height:22px}
.tab.on{color:var(--ink);background:var(--surface2)}
.tab .dot{width:6px;height:6px;border-radius:50%;background:var(--catch)}
/* sheet */
.sheet{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet-bg{position:absolute;inset:0;background:rgba(5,12,16,.55);border:none}
.sheet-panel{position:relative;width:100%;max-width:600px;max-height:92%;overflow-y:auto;background:var(--bg);border-radius:20px 20px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px calc(24px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.sheet-h{display:flex;justify-content:space-between;align-items:center;gap:12px}
/* the tenya catalog is long: keep the title + 完了 pinned at the top and a 完了 bar pinned at the bottom of the sheet */
.sheet-h.stick{position:sticky;top:-18px;z-index:3;margin:-18px calc(-1 * max(16px,env(safe-area-inset-right,0px))) 0 calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:14px max(16px,env(safe-area-inset-right,0px)) 10px max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-bottom:1px solid var(--line)}
.tb-foot{position:sticky;bottom:calc(-24px - env(safe-area-inset-bottom,0px));z-index:3;margin:0 calc(-1 * max(16px,env(safe-area-inset-right,0px))) calc(-24px - env(safe-area-inset-bottom,0px)) calc(-1 * max(16px,env(safe-area-inset-left,0px)));padding:10px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--surface);border-top:1px solid var(--line)}
.tb-foot .btn{width:100%;min-height:48px;font-size:16px}
.trow-cur{display:flex;align-items:center;gap:10px;border-bottom:1px solid var(--line);padding:10px 2px}
.tc-lbl{flex:1;min-width:0;display:flex;align-items:center;gap:12px}
.tc-btns{flex:none;display:flex;flex-direction:column;gap:6px;width:9.5em}
.tc-b{display:flex;flex-direction:column;align-items:center;line-height:1.15;padding:6px 8px;border-radius:12px;border:1px solid var(--teal);background:transparent;color:var(--teal);font-family:inherit;font-size:13px;font-weight:800;text-align:center}
.tc-b small{font-size:10px;font-weight:600;color:var(--muted)}
.tc-b.add{border-color:var(--amber);color:var(--amber);background:rgba(227,164,59,.1)} .tc-b.add small{color:var(--amber);opacity:.8}
/* colour code: 所有テンヤ（持っている）= teal, 今日のリスト（使う）= amber */
.sheet-panel.tm-set{--acc:var(--amber);--acc-ink:#1a1204}
.sheet-panel.tm-mine{--acc:var(--teal);--acc-ink:var(--catch-ink)}
.tm-set .sheet-h h2::before,.tm-mine .sheet-h h2::before{content:"所有テンヤ";display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:999px;margin-right:8px;vertical-align:middle;background:var(--acc);color:var(--acc-ink)}
.tm-set .sheet-h h2::before{content:"今日のリスト"}
.tm-set .sheet-h.stick,.tm-set .tb-foot{border-color:rgba(227,164,59,.55)}
.tm-set .sheet-h .btn.primary,.tm-set .tb-foot .btn.primary{background:var(--amber);border-color:var(--amber);color:#1a1204}
.tm-set .tck.on{background:var(--amber);border-color:var(--amber);color:#1a1204}
.tm-set .tbgh i,.tm-set .tbph{color:var(--amber)}
.chip.setchip.on{background:var(--amber);border-color:var(--amber);color:#1a1204}
.setcard{border-left:3px solid var(--amber)}
.tb-foot .btn.tb-foot-link{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%;margin:0 0 8px;min-height:48px;padding:7px 12px;border:2px solid var(--teal);border-radius:14px;background:rgba(65,201,198,.12);color:var(--teal);font-family:inherit}
.tb-foot-link span{font-size:15px;font-weight:800} .tb-foot-link span::after{content:" →"} .tb-foot-link small{font-size:11px;font-weight:500;color:var(--muted)}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface2);padding:4px;border-radius:12px;border:1px solid var(--line)}
.seg button{border:none;background:none;min-height:42px;border-radius:9px;font-weight:700;color:var(--muted)}
.seg button.on{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.15)}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;aspect-ratio:1;max-width:100%}
.grid3 button{border:1px solid var(--line);background:var(--surface);border-radius:10px;font-weight:700;font-size:14px;min-height:48px;padding:0;display:flex;align-items:center;justify-content:center;flex-direction:column}
.grid3 button.on{background:var(--chipon);color:var(--chipon-ink);border-color:var(--chipon)}
.grid3 .arr{font-size:24px;line-height:1}
.grid3 .ctr svg{width:24px;height:36px}
.grid3 .ctr small{font-size:11px}
.pick2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pick2 .lbl{font-size:13px;color:var(--muted);font-weight:500;margin-bottom:6px}
.pick2 .val{font-weight:700;margin-top:6px;font-size:14px}
.check{display:flex;align-items:center;gap:10px;min-height:44px}
.check input{width:22px;height:22px}
.prevlist{display:flex;flex-direction:column;gap:6px}
.prevlist button{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;font-size:14px}
.steps{margin:0;padding-left:1.4em;display:flex;flex-direction:column;gap:8px;font-size:14px}
.steps code{font-family:ui-monospace,Menlo,monospace;background:var(--surface2);padding:1px 5px;border-radius:5px;font-size:13px}
.imgout{width:100%;border-radius:10px;border:1px solid var(--line)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);border-radius:12px;padding:10px 12px 10px 16px;
  display:flex;align-items:center;gap:12px;width:min(92vw,520px);font-size:14px;box-shadow:0 8px 24px rgba(0,0,0,.25)}

.qty b small{font-family:"Noto Sans JP",sans-serif;font-size:10px;color:var(--muted);margin-left:1px}
.trow-q{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border-bottom:1px solid var(--line);padding-right:4px}
.trow-own{flex-wrap:wrap}
.tadd{flex:none;min-height:40px;padding:6px 12px;border-radius:999px;border:1px solid var(--teal);background:transparent;color:var(--teal);font-size:13px;font-weight:700;white-space:nowrap}
.trow-q.is-own{background:rgba(65,201,198,.06)}
.townd{color:var(--teal);font-weight:700;margin-right:6px}
.tb-own{margin:0;padding:8px 10px;border-radius:10px;background:rgba(65,201,198,.08);border:1px solid rgba(65,201,198,.3);font-size:13px;line-height:1.6}
.tb-own b{display:block;color:var(--teal)}
.tsets{flex:0 0 100%;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:0 0 12px 52px;font-size:13px}
.tset{min-height:34px;padding:4px 12px;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink,inherit);font-size:13px;white-space:nowrap}
.tset.on{border-color:var(--teal);color:var(--teal);background:rgba(54,200,200,.10)}
.trow-q .trow{border-bottom:none;flex:1;min-width:0}
.trow-own .qty{margin-right:4px}
.tchip.mine{display:flex;width:100%;align-items:center;gap:8px;padding:6px 6px 6px 10px}
.tchip.mine:has(.timg){display:grid;grid-template-columns:auto minmax(0,1fr) auto;column-gap:10px;row-gap:4px}.tchip.mine:has(.timg) .timg{grid-row:1/3;align-self:center}.tchip.mine:has(.timg) .mc-n{grid-column:2;grid-row:1}.tchip.mine:has(.timg) .qty{grid-column:2;grid-row:2;justify-self:start}.tchip.mine:has(.timg) .tx{grid-column:3;grid-row:1/3;align-self:center}
.tchip.mine .mc-n{flex:1;min-width:0;display:flex;flex-direction:column}
.tchip.mine .mc-n b{font-size:14px}
/* back bar: opaque strip docked right above the tab bar, so nothing shows through */
.backbar{left:0;right:0;transform:none;width:auto;bottom:var(--tabs-h,64px);padding:8px 16px;background:var(--bg);border-top:1px solid var(--line);box-shadow:0 -10px 24px rgba(0,0,0,.55)}
.backbar button{max-width:560px;margin:0 auto;min-height:50px;padding:8px 16px;border-radius:14px;justify-content:center;gap:10px;box-shadow:none}
.backbar span{flex-direction:row;align-items:baseline;gap:10px}
.backbar b{font-size:18px}.backbar small{font-size:13px;opacity:.75;font-weight:700}
.backbar button{background:var(--amber);color:#1a1203}
/* site header: app icon + TOKYO BAY FISHING (matches the site's tool pages) */
.top-in{gap:10px}
.brand{display:flex;align-items:center;gap:12px;min-width:0;letter-spacing:0}
.b-ic{width:48px;height:48px;border-radius:12px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.08),0 4px 14px rgba(0,0,0,.4)}
.b-tx{display:flex;flex-direction:column;min-width:0;line-height:1.15}
.b-tx b{font-family:"Barlow Condensed",var(--f-num);font-weight:600;font-size:24px;letter-spacing:.14em;color:var(--ink);white-space:nowrap}
.b-tx span{font-size:11px;color:var(--muted);letter-spacing:.08em;margin-top:2px;white-space:nowrap}
.b-tx small{font-family:"Barlow Condensed",var(--f-num);font-size:12px;letter-spacing:.16em;color:var(--muted);font-weight:500;white-space:nowrap;display:block}
@media(max-width:380px){.b-tx b{font-size:20px;letter-spacing:.1em}}
body.has-dock .b-ic{width:40px;height:40px;border-radius:10px}
body.has-dock .b-tx b{font-size:18px;letter-spacing:.08em}
body.has-dock .b-tx span,body.has-dock .b-tx small{display:none}
body.has-trip .b-tx>b{display:none}
body.has-trip .rhead{display:none}
.rmeta .rm-time,.rmeta .rm-edit{display:none}
.rm-txt{display:flex;flex-wrap:wrap;gap:4px 0;min-width:0}
body.has-trip .rmeta{align-items:center;gap:8px;margin-top:0;font-size:14px}
body.has-trip .rm-txt{flex:1;flex-wrap:nowrap;white-space:nowrap;overflow:hidden;-webkit-mask-image:linear-gradient(to right,#000 88%,transparent)}
body.has-trip .rmeta .rm-edit{display:inline-flex;flex:none;margin:0;min-height:28px;padding:0 14px}
body.has-trip main{padding-top:8px}body.has-trip .rmeta{margin-bottom:-6px}
.b-trip{display:flex;align-items:center;gap:10px;font-style:normal;line-height:1.2;min-width:0}
.bt-now{display:flex;flex-direction:column;align-items:flex-start;font-family:var(--f-num);font-size:34px;font-weight:600;line-height:1;color:var(--ink);letter-spacing:.02em;font-variant-numeric:tabular-nums}
.bt-now i{font-style:normal;font-family:var(--f-body);font-size:10px;font-weight:700;color:var(--teal);letter-spacing:.1em;margin-bottom:1px}
.bt-sub,body.has-dock .b-tx .bt-sub{display:flex;flex-direction:column;min-width:0;margin:0;letter-spacing:0}
.b-trip b{font-size:14px;font-weight:800;color:var(--ink);white-space:nowrap} .b-trip b em{font-style:normal;font-weight:600;color:var(--muted)}
body.has-dock .b-trip small{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:0;font-family:var(--f-body)}
.brand{flex:1;min-width:0}
.b-tx{flex:1;overflow:hidden}
.b-tx b{font-size:clamp(17px,5.6vw,24px);letter-spacing:.1em;overflow:hidden;text-overflow:clip}
.sync{flex:none}
@media(max-width:560px){.sync span{display:none}}
body.has-dock .b-tx b{font-size:clamp(14px,4.2vw,18px);letter-spacing:.06em}
body.has-dock .b-tx b{font-size:clamp(13px,3.7vw,17px);letter-spacing:.05em}
body:not(.has-dock):has(#topCatch:not([hidden])) .b-tx b{font-size:clamp(12px,4.4vw,20px);letter-spacing:.05em}
@media(max-width:340px){body:not(.has-dock):has(#topCatch:not([hidden])) .b-tx b{font-size:13px;letter-spacing:0}}

    <rect x="158" y="24" width="120" height="56" rx="10" style="fill:var(--surface);stroke:var(--line)"/>${tx(168,42,'使用テンヤ',{s:10,f:'var(--muted)'})}${tx(168,64,'SS AH ケイムラ',{s:12,w:700})}${tx(268,56,'▾',{s:14,a:'end',f:'var(--teal)'})}
    <rect x="158" y="90" width="120" height="56" rx="10" style="fill:rgba(227,164,59,.12);stroke:var(--amber)"/><rect x="168" y="108" width="20" height="20" rx="5" style="fill:var(--amber)"/><path d="M172 118 l4 4 l8 -9" style="stroke:#1a1203;fill:none" stroke-width="2.4" stroke-linecap="round"/>${tx(196,116,'ドラゴン',{s:13,w:700,f:'var(--amber)'})}${tx(196,132,'120cm以上',{s:10,f:'var(--muted)'})}`;
  let curve='',dots='';for(let k=0;k<=60;k++){const x=24+k*4,y=78-Math.sin(k/60*Math.PI*1.6+.4)*30;curve+=(k?'L':'M')+x+','+y.toFixed(1)}
  [[60,1],[92,0],[110,1],[150,0],[176,0],[198,1]].forEach(([x,d])=>{const k=(x-24)/4,y=78-Math.sin(k/60*Math.PI*1.6+.4)*30;dots+=`<circle cx="${x}" cy="${y.toFixed(1)}" r="${d?5:3.6}" style="fill:${d?'var(--amber)':'var(--teal)'}"/>`});
  return `<rect x="10" y="10" width="280" height="96" rx="12" style="fill:var(--surface2);stroke:var(--line)"/><path d="${curve}" style="fill:none;stroke:#f2d64b" stroke-width="2.2"/>${dots}
    <path d="M40,122 L236,122 Q262,126 276,138 Q262,150 236,154 L40,154 Q34,138 40,122 Z" style="fill:var(--surface2);stroke:var(--ink)" stroke-width="1.5"/>
    ${[0,1,2,3,4,5,6].map(j=>`<circle cx="${226-j*28}" cy="130" r="${j===2?7:4}" style="fill:${j===2?'var(--amber)':'var(--muted)'}"/><circle cx="${226-j*28}" cy="146" r="4" style="fill:var(--muted)"/>`).join('')}`}
const TUT=[
  {k:'ようこそ',t:'釣果を時間の経過と共に記録',d:'ドラゴンカウンターは、タチウオの釣果を時間の経過と共に、使ったテンヤ・潮・船の向きと一緒に記録するアプリです。記録はこの端末に保存されます。'},
  {k:'準備',t:'所有テンヤを登録',d:'画面下の右端にある「登録」タブで、カタログから持っているテンヤにチェック。カタログには今販売されている多くのテンヤが入っていて、月に一度更新する予定です。その中から当日持っていく分を「一軍リスト」のようにまとめておきます。'},
  {k:'出船',t:'釣り場と席を選ぶ',d:'釣り場を選ぶだけで、潮回りと満潮・干潮が自動で入ります。よく行く釣り場は地図から登録できます。船と自分の席もタップで選びます。餌はイワシ（サイズ・頭つき／なし・内臓あり／なし）、ハイブリッドクロス、カマスなどから選べます。'},
  {k:'釣れたら',t:'「釣れた」を1タップ',d:'「釣れた＋1」は、横の「使用テンヤ」で選んでいるテンヤで1本記録します。テンヤを付け替えたら、画面下のテンヤのボタンで使用テンヤを切り替えます（押しても記録はされません）。120cm以上なら先に「ドラゴン」にチェック。アタリ・バラシも、使用テンヤに紐づいて記録されます。押し間違えたら下の「直前の釣果を取り消し」。タチウオ以外が掛かったら小さな「外道」ボタンから（本数には入りません）。'},
  {k:'沖上がり',t:'図にして振り返る',d:'沖上がりの予定時刻を過ぎると、画面下に「沖上がり」のボタンが出ます。押すと、潮位と釣れた時刻の図、座席の図ができて画像で保存できます。記録はあとから「履歴」の「釣果の記録を修正」で1件ずつ直せます。'},
  {k:'アプリとして使う',t:'ホーム画面に置いて使う',d:SITE?'Safariの共有ボタン →「ホーム画面に追加」で、アイコンからアプリのように開けます。一度開いておけば、電波のない船の上でも使えます。':'Safariでこのページを開き、共有ボタン →「ホーム画面に追加」を選ぶと、アイコンからアプリのように開けます（初回はClaudeへのログインが必要です）。記録はクラウドに同期されるので、Claudeアプリから開いても同じ記録が見られます。'}];
function openTut(i){tutI=i||0;let el=$('#tut');if(!el){el=document.createElement('div');el.id='tut';el.className='tut';el.setAttribute('role','dialog');el.setAttribute('aria-modal','true');el.setAttribute('aria-label','使い方');document.body.appendChild(el);bindTutSwipe(el)}
  el.hidden=false;renderTut()}
function renderTut(){const el=$('#tut');const s=TUT[tutI],last=tutI===TUT.length-1;
  el.innerHTML=`<div class="tut-card"><div class="tut-top"><span class="tut-step">STEP ${tutI+1} / ${TUT.length}・${esc(s.k)}</span><button class="tut-skip" data-act="tutClose">${last?'閉じる':'スキップ'}</button></div>
   <div class="tut-art"><svg viewBox="0 0 300 170" aria-hidden="true">${tutArt(tutI)}</svg></div>
   <h2 class="tut-t">${esc(s.t)}</h2><p class="tut-d">${esc(s.d)}</p>
   <div class="tut-dots">${TUT.map((_,i)=>`<button class="${i===tutI?'on':''}" data-act="tutGo" data-i="${i}" aria-label="ステップ${i+1}"></button>`).join('')}</div>
   <div class="tut-nav">${tutI?'<button class="btn" data-act="tutPrev">戻る</button>':'<span></span>'}<button class="btn primary" data-act="${last?'tutClose':'tutNext'}" id="tutNext">${last?'はじめる':'次へ'}</button></div></div>`;
  const n=$('#tutNext');n&&n.focus({preventScroll:true})}
function closeTut(){const el=$('#tut');if(el)el.hidden=true;if(!S.ui.tutDone||!S.ui.tutApp){S.ui.tutDone=true;S.ui.tutApp=true;saveLocal()}}
function bindTutSwipe(el){let x0=null,y0=0;el.addEventListener('pointerdown',e=>{x0=e.clientX;y0=e.clientY});
  el.addEventListener('pointerup',e=>{if(x0===null)return;const dx=e.clientX-x0,dy=e.clientY-y0;x0=null;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.5){if(dx<0&&tutI<TUT.length-1){tutI++;renderTut()}else if(dx>0&&tutI>0){tutI--;renderTut()}}})}
Object.assign(acts,{tutNext:()=>{if(tutI<TUT.length-1){tutI++;renderTut()}},tutPrev:()=>{if(tutI>0){tutI--;renderTut()}},tutGo:b=>{tutI=+b.dataset.i;renderTut()},tutClose:()=>closeTut(),tutOpen:()=>openTut(0)});
document.addEventListener('keydown',e=>{const el=$('#tut');if(!el||el.hidden)return;if(e.key==='Escape')closeTut();else if(e.key==='ArrowRight'){e.stopImmediatePropagation();acts.tutNext()}else if(e.key==='ArrowLeft'){e.stopImmediatePropagation();acts.tutPrev()}},true);
/* ---------- boot ---------- */
saveLocal();render();keepAwake();
if(!S.ui.tutDone)setTimeout(()=>openTut(0),250);else if(!S.ui.tutApp)setTimeout(()=>openTut(5),250); // 追加した「アプリとして使う」だけ一度見せる
(()=>{const vv=window.visualViewport;const isField=el=>el&&/^(INPUT|TEXTAREA|SELECT)$/.test(el.tagName)&&!/^(checkbox|radio|range|button)$/.test(el.type||'');
  const upd=()=>{const kb=vv?(window.innerHeight-vv.height)>120:isField(document.activeElement);document.body.classList.toggle('kbd',!!kb)};
  if(vv){vv.addEventListener('resize',upd);vv.addEventListener('scroll',upd)}
  document.addEventListener('focusin',()=>setTimeout(upd,60));document.addEventListener('focusout',()=>setTimeout(()=>{upd();window.scrollTo(window.scrollX,window.scrollY)},200))})();
if(SITE&&SITE.sw&&'serviceWorker' in navigator){addEventListener('load',()=>{navigator.serviceWorker.register(SITE.sw,{scope:SITE.scope}).catch(()=>{})})}
setInterval(()=>{if(S.ui.tab==='rec'&&active()){const el=$('#since');if(el&&!el.querySelector('br'))el.textContent=sinceText(active())}},30000);

</script>
