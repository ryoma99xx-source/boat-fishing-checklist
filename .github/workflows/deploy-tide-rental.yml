# Deploys 東京湾の潮と流れ (tide-current-map) to the お名前.com rental server over FTPS.
# Staging: runs automatically when tide-current-map/rental/STAGING_DEPLOY changes on the work branch.
# Production: the same, when tide-current-map/rental/PRODUCTION_DEPLOY changes.
# Manual: Actions → "Deploy tide map to rental server" → Run workflow (needs this file on the default branch).
# See tide-current-map/rental/README.md. The ChatGPT Sites deployment is not touched.
name: Deploy tide map to rental server

on:
  push:
    branches: [claude/relaxed-mayer-1u2nhq]
    paths: [tide-current-map/rental/STAGING_DEPLOY, tide-current-map/rental/PRODUCTION_DEPLOY]
  workflow_dispatch:
    inputs:
      app_ref:
        description: Branch / tag / commit that holds tide-current-map/app
        required: true
        default: claude/funny-dijkstra-n8oyg0
      target:
        description: Where to deploy
        type: choice
        options: [staging, production]
        default: staging

permissions:
  contents: read

concurrency:
  group: deploy-tide-rental
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out the rental build scripts
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          path: tools
          fetch-depth: 2
          persist-credentials: false

      # Manual runs use the "target" input. Pushes deploy to production only when the commit
      # changed PRODUCTION_DEPLOY; anything else goes to staging.
      - name: Decide the target
        id: target
        env:
          INPUT_TARGET: ${{ inputs.target }}
          EVENT: ${{ github.event_name }}
        run: |
          t="${INPUT_TARGET:-staging}"
          if [ "$EVENT" = push ] && git -C tools diff --name-only HEAD~1 HEAD | grep -qx 'tide-current-map/rental/PRODUCTION_DEPLOY'; then t=production; fi
          echo "Deploy target: $t"
          echo "name=$t" >> "$GITHUB_OUTPUT"

      - name: Check out the app (${{ inputs.app_ref || 'claude/funny-dijkstra-n8oyg0' }})
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.app_ref || 'claude/funny-dijkstra-n8oyg0' }}
          path: app-src
          sparse-checkout: tide-current-map/app
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Make sure PHP is available (for the comparison test)
        run: command -v php || (sudo apt-get update && sudo apt-get install -y php-cli)

      - name: Test the app
        working-directory: app-src/tide-current-map/app
        run: npm test

      - name: Build the rental site
        run: node tools/tide-current-map/rental/build-rental.mjs app-src/tide-current-map/app site

      - name: Compare the rental site with the Worker build (php -S)
        run: node tools/tide-current-map/rental/test/compare.mjs app-src/tide-current-map/app --no-apache

      - name: Keep the staging copy out of search engines
        if: ${{ steps.target.outputs.name == 'staging' }}
        run: |
          printf 'User-agent: *\nDisallow: /\n' > site/robots.txt
          printf '\n<IfModule mod_headers.c>\nHeader always set X-Robots-Tag "noindex, nofollow"\n</IfModule>\n' >> site/.htaccess

      # The published v17 page carries a canonical link; keep it (SEO) without editing the app.
      - name: Add the canonical link (production)
        if: ${{ steps.target.outputs.name == 'production' }}
        run: |
          grep -q 'rel="canonical"' site/index.html || sed -i 's#</head>#<link rel="canonical" href="https://tide-current-map.cutlassfish.tokyo/">\n</head>#' site/index.html
          grep -c 'rel="canonical"' site/index.html

      - name: Write config.php (Google Maps key)
        env:
          GOOGLE_MAPS_BROWSER_KEY: ${{ secrets.GOOGLE_MAPS_BROWSER_KEY }}
          GOOGLE_MAPS_ENABLED: ${{ secrets.GOOGLE_MAPS_ENABLED || vars.GOOGLE_MAPS_ENABLED }}
        # var_export writes a safe PHP literal; nothing is printed to the log.
        run: |
          php -r 'echo "<?php\n// Written by the deploy workflow. Do not commit.\nreturn ", var_export(array("GOOGLE_MAPS_BROWSER_KEY" => (string)getenv("GOOGLE_MAPS_BROWSER_KEY"), "GOOGLE_MAPS_ENABLED" => (string)getenv("GOOGLE_MAPS_ENABLED")), true), ";\n";' > site/api/_lib/map-config.config.php
          php -l site/api/_lib/map-config.config.php > /dev/null

      # Each target uses its own FTP account, created for that subdomain only, so a staging
      # run can never write into production (or into WordPress). The account's home is the
      # subdomain's web folder, so the default directory is the account root ("./").
      - name: Choose the FTP account and directory
        id: dir
        env:
          TARGET: ${{ steps.target.outputs.name }}
          USER_STAGING: ${{ secrets.FTP_USERNAME_STAGING }}
          USER_PRODUCTION: ${{ secrets.FTP_USERNAME_PRODUCTION }}
          DIR_STAGING: ${{ secrets.FTP_DIR_STAGING }}
          DIR_PRODUCTION: ${{ secrets.FTP_DIR_PRODUCTION }}
        run: |
          if [ "$TARGET" = production ]; then u="$USER_PRODUCTION"; d="$DIR_PRODUCTION"; else u="$USER_STAGING"; d="$DIR_STAGING"; fi
          if [ -z "$u" ]; then echo "::error::FTP_USERNAME_${TARGET^^} is not set"; exit 1; fi
          if [ -n "$USER_STAGING" ] && [ "$USER_STAGING" = "$USER_PRODUCTION" ]; then
            echo "::error::Staging and production must use different FTP accounts"; exit 1
          fi
          [ -z "$d" ] && d="./"
          case "$d" in *..*) echo "::error::FTP_DIR_${TARGET^^} must not contain '..'"; exit 1;; esac
          d="${d%/}/"
          echo "server_dir=$d" >> "$GITHUB_OUTPUT"

      # Uploads only changed files. Files are deleted on the server only when an earlier run of
      # this workflow uploaded them and they no longer exist in the build, and only inside the
      # target directory. cache/ (PHP file cache) and .well-known/ (SSL validation) are never
      # touched; config.php is written on every run, so it is never deleted.
      - name: Deploy over FTPS
        uses: SamKirkland/FTP-Deploy-Action@a51268f67f6605236975928ae28b0f7e9971d50a # v4.3.6
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ steps.target.outputs.name == 'production' && secrets.FTP_USERNAME_PRODUCTION || secrets.FTP_USERNAME_STAGING }}
          password: ${{ steps.target.outputs.name == 'production' && secrets.FTP_PASSWORD_PRODUCTION || secrets.FTP_PASSWORD_STAGING }}
          protocol: ftps
          local-dir: ./site/
          server-dir: ${{ steps.dir.outputs.server_dir }}
          dangerous-clean-slate: false
          log-level: standard
          exclude: |
            **/cache/**
            **/.well-known/**
            **/.git*
            **/.git*/**
